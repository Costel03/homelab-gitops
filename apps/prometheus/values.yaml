# Metrics. Grafana reads it at prometheus-server.monitoring.svc.
enabled: true
namespace: monitoring
syncWave: 0
chart:
  repository: https://prometheus-community.github.io/helm-charts
  name: prometheus
  version: 29.35.0
values:
  server:
    persistentVolume:
      enabled: true
      size: 8Gi
      storageClass: nfs-client
    retention: 15d
    global:
      scrape_interval: 60s
      evaluation_interval: 60s
    # ~262Mi on a new cluster; the head block grows with series, so the
    # limit leaves room for it.
    resources:
      requests: { cpu: 50m, memory: 320Mi }
      limits: { memory: 1Gi }
  configmapReload:
    prometheus:
      resources:
        requests: { cpu: 5m, memory: 16Mi }
        limits: { memory: 64Mi }
  # The subcharts below set no resources at all, which makes them BestEffort:
  # first to be evicted, and invisible to the scheduler.
  alertmanager:
    enabled: true
    persistence:
      size: 2Gi
      storageClass: nfs-client
    resources:
      requests: { cpu: 5m, memory: 24Mi }
      limits: { memory: 128Mi }
  prometheus-pushgateway:
    enabled: false
  prometheus-node-exporter:
    enabled: true
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 64Mi }
  kube-state-metrics:
    enabled: true
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
