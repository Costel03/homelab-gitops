# argocd-server picks up argocd-server-tls on its own; cert-manager renews it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-tls
  namespace: argocd
spec:
  secretName: argocd-server-tls
  commonName: argocd.homelab
  dnsNames:
  - argocd.homelab
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: homelab-ca
    kind: ClusterIssuer
    group: cert-manager.io
