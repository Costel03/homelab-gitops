# Sets ArgoCD's admin password from Vault (engine argocd, path admin).
# Seed it with scripts/seed-vault-secrets.sh.
#
# Merge, not Owner: argocd-secret is created by the ArgoCD Helm release and
# holds other keys ArgoCD needs. passwordMtime comes from Vault, set when the
# password is — ArgoCD logs everyone out whenever it changes, so it must not
# be generated here on every refresh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-admin-password
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-argocd
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
    template:
      engineVersion: v2
      data:
        admin.password: "{{ .password | bcrypt }}"
        admin.passwordMtime: "{{ .passwordMtime }}"
  data:
  - secretKey: password
    remoteRef:
      key: admin
      property: password
  - secretKey: passwordMtime
    remoteRef:
      key: admin
      property: passwordMtime
