# Defaults only. The deployed values are in ../values.yaml under `values:`.
image:
  repository: nginx
  tag: 1.30.5-alpine
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 80
  annotations: {}

ingress:
  enabled: false
  className: traefik
  host: my-app.homelab

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# No CPU limit: Helm merges these with the deployed values, so a limit here
# could not be removed from ../values.yaml.
resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi
