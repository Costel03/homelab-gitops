# Copies secrets out of Vault into Kubernetes Secrets. Authenticates with the
# vault-token Secret that `make vault` creates in this namespace.
# manifests/ holds the ClusterSecretStore pointing at Vault.
enabled: true
namespace: eso
syncWave: 2
chart:
  repository: https://charts.external-secrets.io
  name: external-secrets
  version: 2.11.0
# The SecretStore CRDs exceed client-side apply's 256 KB annotation limit.
syncOptions:
- ServerSideApply=true
values:
  replicaCount: 1
  installCRDs: true
  leaderElect: true
  # Measured ~33Mi per component.
  resources:
    requests: { cpu: 20m, memory: 48Mi }
    limits: { memory: 256Mi }
  webhook:
    resources:
      requests: { cpu: 10m, memory: 40Mi }
      limits: { memory: 128Mi }
  certController:
    resources:
      requests: { cpu: 10m, memory: 40Mi }
      limits: { memory: 128Mi }
