# Points ESO at Vault's "argocd" KV v2 engine, which holds the ArgoCD and
# Grafana admin passwords (written by scripts/seed-vault-secrets.sh).
# Authenticates with the vault-token Secret `make vault` creates. Wave 1, so
# the chart's CRDs exist first. TLS comes from cert-manager, not Vault.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    vault:
      server: http://hashicorp-vault.hashicorp-vault.svc:8200
      path: argocd
      version: v2
      auth:
        tokenSecretRef:
          name: vault-token
          namespace: eso
          key: token
