# Resource metrics for kubectl top and the HPA in my-app.
enabled: true
namespace: kube-system
syncWave: -1
chart:
  repository: https://kubernetes-sigs.github.io/metrics-server
  name: metrics-server
  version: 3.14.0
values:
  args:
  # kubeadm's kubelet serving certs are self-signed.
  - --kubelet-insecure-tls
  - --kubelet-preferred-address-types=InternalIP
  # Measured ~22Mi.
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }
