# VPA from the Kubernetes autoscaler project's own chart. The cowboysysop
# chart used before is no longer published, and its values were nested under
# a key the Application never passed through, so none of these limits applied.
enabled: true
namespace: vpa-system
syncWave: 0
chart:
  repository: https://kubernetes.github.io/autoscaler
  name: vertical-pod-autoscaler
  version: 0.13.0
values:
  admissionController:
    # The webhook certificate comes from cert-manager and the homelab CA
    # instead of the chart's certgen Job, whose 2023 image fails the scan gate.
    certGen:
      enabled: false
    registerWebhook: false
    certManager:
      enabled: true
      issuerRef:
        name: homelab-ca
        kind: ClusterIssuer
        group: cert-manager.io
    # The chart runs two of each component for HA; one is plenty here.
    # Measured ~10Mi each.
    replicas: 1
    resources:
      requests: { cpu: 10m, memory: 24Mi }
      limits: { memory: 128Mi }
  recommender:
    replicas: 1
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 256Mi }
  updater:
    replicas: 1
    resources:
      requests: { cpu: 10m, memory: 24Mi }
      limits: { memory: 128Mi }
