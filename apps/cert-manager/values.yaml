# Issues and renews every TLS certificate in the cluster from the homelab CA.
# Must stay enabled — ArgoCD, Vault and Grafana all get their certificates here.
enabled: true
namespace: cert-manager
syncWave: -2
chart:
  repository: https://charts.jetstack.io
  name: cert-manager
  version: v1.21.2
# The CRDs exceed client-side apply's annotation size limit.
syncOptions:
- ServerSideApply=true
values:
  crds:
    enabled: true
    keep: true
  # Sized from measured use (controller ~24Mi, cainjector ~33Mi, webhook
  # ~12Mi). No CPU limits anywhere in this repo: CPU is compressible, and
  # throttling only makes probes time out.
  replicaCount: 1
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 192Mi }
  webhook:
    replicaCount: 1
    resources:
      requests: { cpu: 10m, memory: 24Mi }
      limits: { memory: 96Mi }
  cainjector:
    replicaCount: 1
    resources:
      requests: { cpu: 10m, memory: 48Mi }
      limits: { memory: 192Mi }
  startupapicheck:
    enabled: true
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 64Mi }
