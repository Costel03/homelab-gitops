# Grafana's admin login from Vault (engine argocd, path grafana).
# Seed it with scripts/seed-vault-secrets.sh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-argocd
    kind: ClusterSecretStore
  target:
    name: grafana-admin-secret
    creationPolicy: Owner
  data:
  - secretKey: admin-user
    remoteRef:
      key: grafana
      property: username
  - secretKey: admin-password
    remoteRef:
      key: grafana
      property: password
