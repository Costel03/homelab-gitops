# Logs, single process. Grafana reads it at loki.monitoring.svc:3100.
# The chart moved to grafana-community in 2026; the grafana repo copy is frozen.
enabled: true
namespace: monitoring
syncWave: 0
chart:
  repository: https://grafana-community.github.io/helm-charts
  name: loki
  version: 18.13.7
values:
  deploymentMode: Monolithic
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
      storageClass: nfs-client
    # ~72Mi with no logs flowing yet; ingestion buffers chunks in memory.
    resources:
      requests: { cpu: 25m, memory: 128Mi }
      limits: { memory: 512Mi }
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  gateway:
    enabled: false
  # The canary DaemonSet writes synthetic logs to measure Loki; the test
  # depends on it. Neither is useful here.
  lokiCanary:
    enabled: false
  test:
    enabled: false
  sidecar:
    resources:
      requests: { cpu: 5m, memory: 32Mi }
      limits: { memory: 128Mi }
  # memcached is too heavy for this cluster.
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
