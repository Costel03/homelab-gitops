{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ .Release.Name }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  selector:
    {{- toYaml .Values.istio.selector | nindent 4 }}
  servers:
  - port:
      number: {{ .Values.istio.port }}
      name: http
      protocol: HTTP
    hosts:
    - {{ .Values.istio.host | quote }}
{{- end }}
